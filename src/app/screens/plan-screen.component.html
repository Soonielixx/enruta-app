<div class="form-heading"><span class="eyebrow">ALTA DE EMPRESA · PASO 2 DE 2</span><h2>Plan y módulos</h2><p>Puedes cambiar de plan y activar módulos cuando lo necesites.</p></div>
            <div class="plan-grid">
              <button class="plan-card" [class.plan-selected]="app.selectedPlan === 'Esencial'" type="button" (click)="app.selectedPlan = 'Esencial'"><span>Esencial</span><small>Ruta, entrega y cobro</small><strong>Elegir</strong></button>
              <button class="plan-card" [class.plan-selected]="app.selectedPlan === 'Operación'" type="button" (click)="app.selectedPlan = 'Operación'"><span>Operación</span><small>Preventa y liquidación</small><strong>{{ app.selectedPlan === 'Operación' ? 'Elegido' : 'Elegir' }}</strong></button>
              <button class="plan-card" [class.plan-selected]="app.selectedPlan === 'Empresarial'" type="button" (click)="app.selectedPlan = 'Empresarial'"><span>Empresarial</span><small>Integración ERP y SSO</small><strong>Cotizar</strong></button>
            </div>
            <h3 class="small-heading">Módulos que puedes activar</h3>
            <div class="module-checks"><label class="check-line"><input type="checkbox" [(ngModel)]="app.planModules['Preventa']" [ngModelOptions]="{standalone: true}"> Preventa</label><label class="check-line"><input type="checkbox" [(ngModel)]="app.planModules['Autoventa']" [ngModelOptions]="{standalone: true}"> Autoventa</label><label class="check-line"><input type="checkbox" [(ngModel)]="app.planModules['Activos en comodato']" [ngModelOptions]="{standalone: true}"> Activos en comodato</label><label class="check-line"><input type="checkbox" [(ngModel)]="app.planModules['Auditoría de exhibición']" [ngModelOptions]="{standalone: true}"> Auditoría de exhibición</label></div>
            <div class="form-row between plan-actions"><button class="secondary-button" type="button" (click)="app.openAuth('register'); app.registrationStep = 1">← Atrás</button><button class="primary-button" type="button" [disabled]="!app.selectedPlan" (click)="app.continueRegistration()">Crear cuenta <span>→</span></button></div>
